[project]
name = "bsai-comfyui-contextual-series"
version = "2.0.0"
description = "Asset library, clip management, subtitle rendering, and media combining for MiniMax H3 workflows. Includes storyboard-style clip sequencing, 旁白/对白 subtitles with C:\\Windows\\Fonts support, and video/audio concatenation."
authors = [{ name = "BSAI", email = "xm6018924@users.noreply.github.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "Pillow",
]

[project.optional-dependencies]
video = ["opencv-python"]
audio = ["torchaudio"]

[project.urls]
Repository = "https://github.com/xm6018924/BSAI-ComfyUI_Contextual-Series"

[tool.comfy]
PublisherId = "bsai"
DisplayName = "BSAI-ComfyUI_Contextual Series"
Icon = "https://raw.githubusercontent.com/xm6018924/BSAI-ComfyUI_Contextual-Series/main/icon.png"
web = "./web"
